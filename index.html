<script type="module">
import { encodeAbiParameters, encodeFunctionData, decodeFunctionResult, parseAbi, concatHex, parseEther, formatEther, formatUnits, numberToHex, hexToBigInt } from "./viem.bundle.mjs";

/* ---------- constants (same as scripts/src/zto-buy.ts) ---------- */
const RPCS = ["https://ethereum-rpc.publicnode.com", "https://gateway.tenderly.co/public/mainnet", "https://eth.llamarpc.com"];
const UNIVERSAL_ROUTER = "0x0542093271a31f6fc1dadb232bd59eeb27de780f"; // Uniswap Universal Router V2.2 (v4)
const V4_QUOTER = "0x52f0e24d1c21c8a0cb1e5a5dd6198556bd9e1203";
const ETH = "0x0000000000000000000000000000000000000000";
const IMD = "0xd34a99bc0f67ae1bbd63c660e6d0b0dd03e263b7";
const ZTO = "0xd782bdea4ef02a0bd391eb9089470c8080f0a68e";
const ETH_IMD = { currency0: ETH, currency1: IMD, fee: 10000, tickSpacing: 200, hooks: ETH };
const IMD_ZTO = { currency0: IMD, currency1: ZTO, fee: 12500, tickSpacing: 60, hooks: "0x784ff9a3ac5d88a30bfff6f7f2a270161fbe6000" };
const PAGE = location.origin + location.pathname;

const UR_ABI = parseAbi(["function execute(bytes commands, bytes[] inputs, uint256 deadline) payable"]);
const QUOTER_ABI = parseAbi(["function quoteExactInputSingle(((address currency0, address currency1, uint24 fee, int24 tickSpacing, address hooks) poolKey, bool zeroForOne, uint128 exactAmount, bytes hookData) params) returns (uint256 amountOut, uint256 gasEstimate)"]);
const POOL_KEY = { type: "tuple", components: [
  { name: "currency0", type: "address" }, { name: "currency1", type: "address" }, { name: "fee", type: "uint24" }, { name: "tickSpacing", type: "int24" }, { name: "hooks", type: "address" } ] };
const SWAP_IN_SINGLE = [{ type: "tuple", components: [
  { name: "poolKey", ...POOL_KEY }, { name: "zeroForOne", type: "bool" }, { name: "amountIn", type: "uint128" }, { name: "amountOutMinimum", type: "uint128" }, { name: "minHopPriceX36", type: "uint256" }, { name: "hookData", type: "bytes" } ] }];
const byte = (n) => "0x" + n.toString(16).padStart(2, "0");

/** ETH -> IMD -> ZTO in one Universal Router call: V4_SWAP(0x10) with SWAP_EXACT_IN_SINGLE x2, SETTLE_ALL, TAKE_ALL. */
function buildCalldata(ethIn, minOut) {
  const actions = concatHex([byte(6), byte(6), byte(12), byte(15)]);
  const params = [
    encodeAbiParameters(SWAP_IN_SINGLE, [{ poolKey: ETH_IMD, zeroForOne: true, amountIn: ethIn, amountOutMinimum: 0n, minHopPriceX36: 0n, hookData: "0x" }]),
    encodeAbiParameters(SWAP_IN_SINGLE, [{ poolKey: IMD_ZTO, zeroForOne: true, amountIn: 0n, amountOutMinimum: minOut, minHopPriceX36: 0n, hookData: "0x" }]),
    encodeAbiParameters([{ type: "address" }, { type: "uint256" }], [ETH, ethIn]),
    encodeAbiParameters([{ type: "address" }, { type: "uint256" }], [ZTO, minOut]),
  ];
  const v4 = encodeAbiParameters([{ type: "bytes" }, { type: "bytes[]" }], [actions, params]);
  const deadline = BigInt(Math.floor(Date.now() / 1000) + 600);
  return encodeFunctionData({ abi: UR_ABI, functionName: "execute", args: [byte(16), [v4], deadline] });
}

/* ---------- rpc ---------- */
let rpcIx = 0;
async function rpc(method, params) {
  for (let i = 0; i < RPCS.length; i++) {
    const url = RPCS[(rpcIx + i) % RPCS.length];
    try {
      const r = await fetch(url, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ jsonrpc: "2.0", id: 1, method, params }) });
      const j = await r.json();
      if (j.error) throw new Error(j.error.message || "rpc error");
      rpcIx = (rpcIx + i) % RPCS.length;
      return j.result;
    } catch (e) { if (i === RPCS.length - 1) throw e; }
  }
}
async function quoteSingle(poolKey, amount) {
  const data = encodeFunctionData({ abi: QUOTER_ABI, functionName: "quoteExactInputSingle", args: [{ poolKey, zeroForOne: true, exactAmount: amount, hookData: "0x" }] });
  const out = await rpc("eth_call", [{ to: V4_QUOTER, data }, "latest"]);
  return decodeFunctionResult({ abi: QUOTER_ABI, functionName: "quoteExactInputSingle", data: out })[0];
}
async function quoteEthToZto(ethIn) { const imd = await quoteSingle(ETH_IMD, ethIn); return quoteSingle(IMD_ZTO, imd); }

/* ---------- ui state ---------- */
const $ = (id) => document.getElementById(id);
const framed = window.self !== window.top;
if (framed) document.body.classList.add("framed");
const openExt = (url) => framed ? window.open(url, "_blank", "noopener") : window.location.assign(url);
for (const a of document.querySelectorAll("a[data-ext]")) a.addEventListener("click", (e) => { e.preventDefault(); openExt(a.href); });

let slipBps = 500n, ethIn = 0n, ztoOut = 0n, quoteSeq = 0, ethUsd = 0, ztoUsd = 0;
let provider = null, account = null, chainId = null, busy = false;
const fmt = (v, d = 18, max = 4) => Number(formatUnits(v, d)).toLocaleString("en-US", { maximumFractionDigits: max });
const usd = (n) => n >= 1 ? "$" + n.toLocaleString("en-US", { maximumFractionDigits: 2 }) : n > 0 ? "$" + n.toPrecision(3) : "";

async function loadPrice() {
  try {
    const [z, w] = await Promise.all([
      fetch("https://api.dexscreener.com/tokens/v1/ethereum/" + ZTO).then(r => r.json()),
      fetch("https://api.dexscreener.com/tokens/v1/ethereum/0xC02aaA39b223FE8D0A0e5C4F27eAD9083C756Cc2").then(r => r.json()),
    ]);
    const p = (z || []).sort((a, b) => (b.liquidity?.usd || 0) - (a.liquidity?.usd || 0))[0];
    ethUsd = Number(w?.[0]?.priceUsd || 0);
    if (p) {
      ztoUsd = Number(p.priceUsd || 0);
      const ch = Number(p.priceChange?.h24 ?? 0);
      $("pxUsd").textContent = usd(ztoUsd) || "—";
      $("pxSub").innerHTML = `<span class="${ch >= 0 ? "up" : "down"}">${ch >= 0 ? "+" : ""}${ch.toFixed(1)}%</span> 24h${p.marketCap ? " · MC " + usd(p.marketCap) : ""}`;
    }
  } catch { $("pxSub").textContent = "price unavailable"; }
  try { // quoter-based price as the live source (DexScreener lags)
    const out = await quoteEthToZto(parseEther("0.001"));
    if (ethUsd && out > 0n) { ztoUsd = (0.001 * ethUsd) / Number(formatUnits(out, 18)) / 0.9775; $("pxUsd").textContent = usd(ztoUsd); }
  } catch {}
}

async function requote() {
  const raw = $("amt").value.trim();
  let v = 0n; try { v = raw ? parseEther(raw) : 0n; } catch { v = 0n; }
  ethIn = v; ztoOut = 0n;
  const seq = ++quoteSeq;
  if (v <= 0n) { $("out").textContent = "0.0"; $("out").classList.add("empty"); $("rate").textContent = "—"; $("minOut").textContent = "—"; $("quoting").textContent = ""; render(); return; }
  $("quoting").textContent = "quoting…";
  try {
    const out = await quoteEthToZto(v);
    if (seq !== quoteSeq) return;
    ztoOut = out;
    $("out").textContent = fmt(out, 18, 0); $("out").classList.remove("empty");
    $("quoting").textContent = ethUsd ? "≈ " + usd(Number(formatEther(v)) * ethUsd) : "";
    const minOut = (out * (10000n - slipBps)) / 10000n;
    $("minOut").textContent = fmt(minOut, 18, 0) + " ZTO";
    $("rate").textContent = "1 ETH = " + fmt((out * 10n ** 18n) / v, 18, 0) + " ZTO";
  } catch (e) {
    if (seq !== quoteSeq) return;
    $("out").textContent = "0.0"; $("out").classList.add("empty");
    $("quoting").textContent = "quote failed: the pool may not cover this size";
    $("rate").textContent = "—"; $("minOut").textContent = "—";
  }
  render();
}

function render() {
  const go = $("go");
  go.classList.remove("ghost");
  if (busy) { go.disabled = true; return; }
  if (!account) { go.disabled = false; go.textContent = "CONNECT WALLET"; return; }
  if (chainId !== 1) { go.disabled = false; go.textContent = "SWITCH TO ETHEREUM"; return; }
  if (ethIn <= 0n) { go.disabled = true; go.textContent = "ENTER AN AMOUNT"; return; }
  if (ztoOut <= 0n) { go.disabled = true; go.textContent = "QUOTING…"; return; }
  go.disabled = false; go.textContent = "BUY $ZTO";
}
function status(msg, cls = "") { $("status").innerHTML = msg; $("status").className = "status " + cls; }

/* ---------- wallets: EIP-6963 + window.ethereum + mobile deep links ---------- */
const found = new Map();
window.addEventListener("eip6963:announceProvider", (e) => { const { info, provider: p } = e.detail || {}; if (info?.uuid && !found.has(info.rdns || info.uuid)) { found.set(info.rdns || info.uuid, { info, provider: p }); renderWallets(); } });
window.dispatchEvent(new Event("eip6963:requestProvider"));
setTimeout(() => { if (!found.size && window.ethereum) { found.set("injected", { info: { name: window.ethereum.isRabby ? "Rabby" : window.ethereum.isMetaMask ? "MetaMask" : "Browser wallet", icon: "" }, provider: window.ethereum }); } renderWallets(); }, 300);

function renderWallets() {
  const box = $("wallets"); box.innerHTML = "";
  if (!box.classList.contains("open")) return;
  for (const [key, w] of found) {
    const b = document.createElement("button"); b.type = "button";
    b.innerHTML = `${w.info.icon ? `<img src="${w.info.icon}" alt="">` : ""}<span>${w.info.name}</span><small>installed</small>`;
    b.onclick = () => connect(w.provider, w.info.name);
    box.appendChild(b);
  }
  if (!found.size) {
    const u = encodeURIComponent(PAGE);
    const host = PAGE.replace(/^https?:\/\//, "");
    const links = [
      ["MetaMask", `https://metamask.app.link/dapp/${host}`],
      ["Coinbase Wallet", `https://go.cb-w.com/dapp?cb_url=${u}`],
      ["Rainbow", `https://rnbwapp.com/dapp?url=${u}`],
    ];
    for (const [name, href] of links) {
      const a = document.createElement("a"); a.href = href; a.innerHTML = `<span>${name}</span><small>open in app</small>`;
      a.onclick = (e) => { e.preventDefault(); openExt(href); };
      box.appendChild(a);
    }
    const a = document.createElement("a"); a.href = PAGE; a.innerHTML = `<span>Open this page in your browser</span><small>↗</small>`;
    a.onclick = (e) => { e.preventDefault(); window.open(PAGE, "_blank", "noopener"); };
    box.appendChild(a);
  }
}

async function connect(p, name) {
  try {
    busy = true; render(); status(`connecting ${name}…`);
    const accs = await p.request({ method: "eth_requestAccounts" });
    provider = p; account = accs[0];
    chainId = Number(hexToBigInt(await p.request({ method: "eth_chainId" })));
    p.on?.("accountsChanged", (a) => { account = a[0] || null; refreshBalance(); render(); });
    p.on?.("chainChanged", (c) => { chainId = Number(hexToBigInt(c)); refreshBalance(); render(); });
    $("wallets").classList.remove("open");
    status(`${account.slice(0, 6)}…${account.slice(-4)} · ${name}`);
    await refreshBalance();
  } catch (e) { status(e?.message || "connection cancelled", "err"); }
  finally { busy = false; render(); }
}
async function refreshBalance() {
  if (!account || chainId !== 1) { $("balLine").classList.add("hid"); return; }
  try {
    const b = hexToBigInt(await rpc("eth_getBalance", [account, "latest"]));
    $("bal").textContent = fmt(b, 18, 4) + " ETH"; $("bal").dataset.wei = b.toString();
    $("balLine").classList.remove("hid");
  } catch {}
}
async function switchChain() {
  try { busy = true; render(); await provider.request({ method: "wallet_switchEthereumChain", params: [{ chainId: "0x1" }] }); chainId = 1; await refreshBalance(); }
  catch (e) { status(e?.message || "switch cancelled", "err"); }
  finally { busy = false; render(); }
}

async function buy() {
  const minOut = (ztoOut * (10000n - slipBps)) / 10000n;
  const data = buildCalldata(ethIn, minOut);
  try {
    busy = true; render(); $("go").textContent = "CONFIRM IN WALLET…";
    status(`buying ≥ ${fmt(minOut, 18, 0)} ZTO for ${formatEther(ethIn)} ETH…`);
    const hash = await provider.request({ method: "eth_sendTransaction", params: [{ from: account, to: UNIVERSAL_ROUTER, data, value: numberToHex(ethIn) }] });
    $("go").textContent = "PENDING…";
    status(`pending · <a href="https://etherscan.io/tx/${hash}" target="_blank" rel="noopener">tx ↗</a>`);
    let rc = null;
    for (let i = 0; i < 120 && !rc; i++) { await new Promise(r => setTimeout(r, 3000)); rc = await rpc("eth_getTransactionReceipt", [hash]).catch(() => null); }
    if (rc?.status === "0x1") { status(`done · you bought $ZTO · <a href="https://etherscan.io/tx/${hash}" target="_blank" rel="noopener">tx ↗</a>`, "ok"); $("amt").value = ""; await requote(); }
    else if (rc) status(`reverted (price moved past your slippage?) · <a href="https://etherscan.io/tx/${hash}" target="_blank" rel="noopener">tx ↗</a>`, "err");
    else status(`still pending · <a href="https://etherscan.io/tx/${hash}" target="_blank" rel="noopener">tx ↗</a>`);
    await refreshBalance();
  } catch (e) {
    const m = e?.shortMessage || e?.message || "cancelled";
    status(/reject|denied|cancel/i.test(m) ? "cancelled in wallet" : m.slice(0, 160), "err");
  } finally { busy = false; render(); }
}

/* ---------- wire up ---------- */
$("amt").addEventListener("input", () => { for (const b of $("presets").children) b.classList.toggle("on", b.dataset.v === $("amt").value); requote(); });
for (const b of $("presets").children) b.onclick = () => { $("amt").value = b.dataset.v; $("amt").dispatchEvent(new Event("input")); };
for (const b of $("slip").children) b.onclick = () => { for (const x of $("slip").children) x.classList.remove("on"); b.classList.add("on"); slipBps = BigInt(b.dataset.v) * 100n; requote(); };
$("max").onclick = () => { const w = BigInt($("bal").dataset.wei || "0"); const keep = parseEther("0.002"); if (w > keep) { $("amt").value = formatEther(w - keep); $("amt").dispatchEvent(new Event("input")); } };
$("go").onclick = () => {
  if (!account) { const box = $("wallets"); box.classList.toggle("open"); renderWallets(); return; }
  if (chainId !== 1) return switchChain();
  if (ztoOut > 0n) return buy();
};
const pre = new URLSearchParams(location.search).get("eth"); if (pre && /^\d*\.?\d+$/.test(pre)) { $("amt").value = pre; $("amt").dispatchEvent(new Event("input")); }
loadPrice(); render();
setInterval(() => { if (ethIn > 0n && !busy) requote(); }, 15000);
</script>
</body>
</html>
